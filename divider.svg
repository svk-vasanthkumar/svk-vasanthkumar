<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="80">
  <defs>
    <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Side Bracket Accents -->
  <g fill="none" stroke="#FF6A00" stroke-width="1.5" opacity="0.6">
    <path d="M 60 25 L 45 25 L 45 55 L 60 55" />
    <path d="M 1140 25 L 1155 25 L 1155 55 L 1140 55" />
  </g>

  <!-- Main Center Lines -->
  <g stroke="#FF6A00" fill="none" stroke-width="1.5" filter="url(#orange-glow)">
    <line x1="50" y1="40" x2="550" y2="40" />
    <line x1="650" y1="40" x2="1150" y2="40" />
  </g>

  <!-- Outer Center HUD Hexagon -->
  <g stroke="#FF6A00" fill="none" stroke-width="1.5" filter="url(#orange-glow)">
    <path d="M 550 40 L 570 20 L 630 20 L 650 40 L 630 60 L 570 60 Z" />
  </g>
  
  <!-- Inner Green Accent Hexagon -->
  <polygon points="582,40 590,28 610,28 618,40 610,52 590,52" fill="none" stroke="#39FF14" stroke-width="1" filter="url(#green-glow)"/>
  
  <!-- Core Data Node -->
  <circle cx="600" cy="40" r="3" fill="#39FF14" filter="url(#green-glow)"/>
  <circle cx="600" cy="40" r="1" fill="#FFFFFF" />

  <!-- Upper Circuit Traces -->
  <g fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.75">
    <path d="M 380 40 L 400 20 L 460 20" />
    <path d="M 820 40 L 800 20 L 740 20" />
  </g>
  <circle cx="460" cy="20" r="2.5" fill="#39FF14" filter="url(#green-glow)"/>
  <circle cx="740" cy="20" r="2.5" fill="#39FF14" filter="url(#green-glow)"/>

  <!-- Lower Circuit Traces -->
  <g fill="none" stroke="#FF6A00" stroke-width="1" opacity="0.75">
    <path d="M 220 40 L 240 60 L 320 60" />
    <path d="M 980 40 L 960 60 L 880 60" />
  </g>
  <circle cx="320" cy="60" r="2.5" fill="#39FF14" filter="url(#green-glow)"/>
  <circle cx="880" cy="60" r="2.5" fill="#39FF14" filter="url(#green-glow)"/>
  
  <!-- HUD Detail Tick Marks -->
  <g fill="none" stroke="#FF6A00" stroke-width="1.2" opacity="0.5">
    <!-- Left Ticks -->
    <path d="M 495 34 L 495 46 M 510 36 L 510 44 M 525 34 L 525 46" />
    <!-- Right Ticks -->
    <path d="M 705 34 L 705 46 M 690 36 L 690 44 M 675 34 L 675 46" />
  </g>

  <!-- Data Pulses (Green) -->
  <g stroke="#39FF14" stroke-width="2.5" filter="url(#green-glow)">
    <line x1="120" y1="40" x2="160" y2="40" />
    <line x1="1040" y1="40" x2="1080" y2="40" />
    <line x1="420" y1="40" x2="435" y2="40" />
    <line x1="765" y1="40" x2="780" y2="40" />
  </g>

  <!-- Tiny Structural Nodes -->
  <g fill="#FF6A00" opacity="0.9">
    <circle cx="180" cy="40" r="1.5" />
    <circle cx="1020" cy="40" r="1.5" />
    <circle cx="280" cy="40" r="1.5" />
    <circle cx="920" cy="40" r="1.5" />
  </g>
</svg>
